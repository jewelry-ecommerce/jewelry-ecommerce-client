name: Frontend CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run tests as well as the build'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Do not force JAVA globally: legacy/mock tests and Java adapter tests use different fixtures.
      - name: Optional tests
        if: ${{ inputs.run_tests }}
        run: npm test
      # npm run build already includes the project's lint/type checks.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_PROVIDER: JAVA
          NEXT_PUBLIC_SITE_URL: https://jewelry-ecommerce-client.vercel.app
